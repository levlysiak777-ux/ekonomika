# Публикует сайт на GitHub Pages: после каждого push в main и после каждого ежедневного сбора данных.
# Коммит с данными делает GITHUB_TOKEN, а такой push сам по себе публикацию не запускает,
# поэтому здесь отдельно указано «после workflow «Обновить данные»».
# Публикуются только файлы сайта, без скриптов и посредника.

name: Опубликовать сайт

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Обновить данные"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Собрать файлы сайта
        run: |
          mkdir _site
          cp -r index.html favicon.svg css js data _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
